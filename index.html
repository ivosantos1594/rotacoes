<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Escolha de Rotações</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 25px;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

input {
  padding: 12px;
  margin: 5px;
  font-size: 16px;
}

button {
  padding: 12px 18px;
  margin: 6px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.sucesso { color: green; font-weight: bold; }
.aviso { color: darkorange; font-weight: bold; }
.erro { color: red; font-weight: bold; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  background: white;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #eee;
}
</style>
</head>

<body>

<h1>Escolha de Rotações</h1>

<div class="card">
  <h2>Entrar</h2>
  <input id="codigo" placeholder="Código">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
  <p id="erro" class="erro"></p>
</div>

<div id="app" style="display:none;">

  <div class="card">
    <h2 id="info"></h2>
    <p id="estado"></p>

    <div id="areaBotoes">
      <button onclick="escolher(1)">Rotação 1</button>
      <button onclick="escolher(2)">Rotação 2</button>
      <button onclick="escolher(3)">Rotação 3</button>
      <button onclick="escolher(4)">Rotação 4</button>
      <button onclick="escolher(5)">Rotação 5</button>
    </div>
  </div>

  <div class="card">
    <h2>Estado das rotações</h2>
    <table>
      <thead>
        <tr>
          <th>Rotação</th>
          <th>N.º alunos</th>
          <th>Códigos</th>
        </tr>
      </thead>
      <tbody id="tabelaRotacoes"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Ordem de escolha</h2>
    <table>
      <thead>
        <tr>
          <th>Ordem</th>
          <th>Código</th>
          <th>Nota</th>
          <th>Escolha</th>
        </tr>
      </thead>
      <tbody id="tabelaAlunos"></tbody>
    </table>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  onSnapshot,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMLECbux4OdQpFrMm5cqI1gBHyOVyj1WM",
  authDomain: "rotacoes-medicina-eb667.firebaseapp.com",
  projectId: "rotacoes-medicina-eb667",
  storageBucket: "rotacoes-medicina-eb667.firebasestorage.app",
  messagingSenderId: "1031472874358",
  appId: "1:1031472874358:web:051a0759a350b2ac4eb057"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const alunos = [
  { c:"7adYa", n:20 },
  { c:"2rd0X", n:19 },
  { c:"ANLjX", n:19 },
  { c:"v3yEg", n:19 },
  { c:"vGaVK", n:19 },
  { c:"vKaEg", n:19 },
  { c:"2EPxV", n:18 },
  { c:"2jBrG", n:18 },
  { c:"2QwzN", n:18 },
  { c:"7PqR9", n:18 },
  { c:"7RwrO", n:18 },
  { c:"A95z0", n:18 },
  { c:"v5mDl", n:18 },
  { c:"vzm59", n:18 },
  { c:"Ag1Qy", n:17 },
  { c:"vodZZ", n:17 },
  { c:"vbd5X", n:16 },
  { c:"AZq0M", n:15 }
];

const ref = doc(db, "rotacoes", "estado");

let user = null;
let dados = null;

async function init() {
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      alunos: alunos.map((a, i) => ({
        ...a,
        ordem: i + 1,
        esc: null
      })),
      rotacoes: {
        1: [],
        2: [],
        3: [],
        4: [],
        5: []
      }
    });
  }
}

await init();

onSnapshot(ref, snap => {
  dados = snap.data();
  if (user) render();
});

window.login = function() {
  const c = document.getElementById("codigo").value.trim();
  const p = document.getElementById("pass").value.trim();

  if (c.toUpperCase() === "ADMIN" && p === "admin123") {
    user = "ADMIN";
    document.getElementById("erro").innerText = "";
    document.getElementById("app").style.display = "block";
    render();
    return;
  }

  const aluno = alunos.find(a =>
    a.c.toLowerCase() === c.toLowerCase()
  );

  if (!aluno) {
    document.getElementById("erro").innerText = "Código inválido.";
    return;
  }

  if (!(p === "1234" || p === aluno.c + "123")) {
    document.getElementById("erro").innerText = "Password inválida.";
    return;
  }

  user = aluno.c;
  document.getElementById("erro").innerText = "";
  document.getElementById("app").style.display = "block";
  render();
};

function alunoDaVez() {
  return dados.alunos.find(a => a.esc === null);
}

function contarRotacoesCom4() {
  return Object.values(dados.rotacoes).filter(r => r.length === 4).length;
}

function podeEscolherRotacao(num) {
  const tamanho = dados.rotacoes[num].length;
  const rotacoesCom4 = contarRotacoesCom4();

  if (tamanho >= 4) return false;
  if (tamanho === 3 && rotacoesCom4 >= 3) return false;

  return true;
}

function render() {
  if (!dados) return;

  atualizarTabelaRotacoes();
  atualizarTabelaAlunos();

  const botoes = document.querySelectorAll("#areaBotoes button");

  if (user === "ADMIN") {
    document.getElementById("info").innerText = "Painel de administrador";
    document.getElementById("estado").innerHTML =
      "<span class='sucesso'>Consulta em tempo real das escolhas.</span>";

    botoes.forEach(b => b.disabled = true);
    return;
  }

  const aluno = dados.alunos.find(a => a.c === user);
  const vez = alunoDaVez();

  document.getElementById("info").innerText =
    `Código: ${aluno.c} | Nota: ${aluno.n} | Ordem: ${aluno.ordem}`;

  if (aluno.esc !== null) {
    document.getElementById("estado").innerHTML =
      `<span class="sucesso">Já escolheste a Rotação ${aluno.esc}.</span>`;
  } else if (!vez) {
    document.getElementById("estado").innerHTML =
      `<span class="sucesso">Todas as escolhas terminaram.</span>`;
  } else if (vez.c === user) {
    document.getElementById("estado").innerHTML =
      `<span class="sucesso">É a tua vez de escolher.</span>`;
  } else {
    const faltam = aluno.ordem - vez.ordem;

    document.getElementById("estado").innerHTML =
      `<span class="aviso">Ainda não é a tua vez. Faltam ${faltam} pessoa(s) antes de ti.</span>`;
  }

  botoes.forEach((botao, index) => {
    const numRotacao = index + 1;

    const pode =
      aluno.esc === null &&
      vez &&
      vez.c === user &&
      podeEscolherRotacao(numRotacao);

    botao.disabled = !pode;
  });
}

window.escolher = async function(numRotacao) {
  if (!user || user === "ADMIN") return;

  try {
    await runTransaction(db, async transaction => {
      const snap = await transaction.get(ref);
      const d = snap.data();

      const alunoIndex = d.alunos.findIndex(a => a.c === user);
      const aluno = d.alunos[alunoIndex];

      if (aluno.esc !== null) {
        throw new Error("Já escolheste.");
      }

      const vez = d.alunos.find(a => a.esc === null);

      if (!vez || vez.c !== user) {
        throw new Error("Ainda não é a tua vez.");
      }

      const tamanho = d.rotacoes[numRotacao].length;
      const rotacoesCom4 = Object.values(d.rotacoes).filter(r => r.length === 4).length;

      if (tamanho >= 4) {
        throw new Error("Esta rotação já está cheia.");
      }

      if (tamanho === 3 && rotacoesCom4 >= 3) {
        throw new Error("Esta rotação já não pode receber mais alunos.");
      }

      d.alunos[alunoIndex].esc = numRotacao;
      d.rotacoes[numRotacao].push(user);

      transaction.update(ref, d);
    });

    alert("Escolha registada com sucesso.");

  } catch (e) {
    alert(e.message);
  }
};

function atualizarTabelaRotacoes() {
  const tbody = document.getElementById("tabelaRotacoes");
  tbody.innerHTML = "";

  for (let i = 1; i <= 5; i++) {
    const lista = dados.rotacoes[i];

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>Rotação ${i}</td>
      <td>${lista.length}</td>
      <td>${lista.length ? lista.join(", ") : "-"}</td>
    `;

    tbody.appendChild(tr);
  }
}

function atualizarTabelaAlunos() {
  const tbody = document.getElementById("tabelaAlunos");
  tbody.innerHTML = "";

  dados.alunos.forEach(a => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${a.ordem}</td>
      <td>${a.c}</td>
      <td>${a.n}</td>
      <td>${a.esc ? "Rotação " + a.esc : "-"}</td>
    `;

    tbody.appendChild(tr);
  });
}

</script>

</body>
</html>
