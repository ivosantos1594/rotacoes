<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Rotações</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.card { background:white; padding:20px; margin-top:20px; border-radius:10px; }
button { padding:10px; margin:5px; }
</style>

</head>
<body>

<h1>Escolha de Rotações</h1>

<div class="card">
  <input id="codigo" placeholder="Código">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Entrar</button>
  <p id="erro" style="color:red;"></p>
</div>

<div id="app" style="display:none;">
  <h3 id="info"></h3>
  <p id="estado"></p>
  <div id="botoes"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc,
  onSnapshot, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 TEU FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyBMLECbux4OdQpFrMm5cqI1gBHyOVyj1WM",
  authDomain: "rotacoes-medicina-eb667.firebaseapp.com",
  projectId: "rotacoes-medicina-eb667",
  storageBucket: "rotacoes-medicina-eb667.firebasestorage.app",
  messagingSenderId: "1031472874358",
  appId: "1:1031472874358:web:051a0759a350b2ac4eb057"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔹 ALUNOS
const alunos = [
  { c:"7adYa", n:20, p:"7adYa123" },
  { c:"2rd0X", n:19, p:"2rd0X123" },
  { c:"ANLjX", n:19, p:"ANLjX123" },
  { c:"v3yEg", n:19, p:"v3yEg123" },
  { c:"vGaVK", n:19, p:"vGaVK123" },
  { c:"vKaEg", n:19, p:"vKaEg123" },
  { c:"2EPxV", n:18, p:"2EPxV123" },
  { c:"2jBrG", n:18, p:"2jBrG123" },
  { c:"2QwzN", n:18, p:"2QwzN123" },
  { c:"7PqR9", n:18, p:"7PqR9123" },
  { c:"7RwrO", n:18, p:"7RwrO123" },
  { c:"A95z0", n:18, p:"A95z0123" },
  { c:"v5mDl", n:18, p:"v5mDl123" },
  { c:"vzm59", n:18, p:"vzm59123" },
  { c:"Ag1Qy", n:17, p:"Ag1Qy123" },
  { c:"vodZZ", n:17, p:"vodZZ123" },
  { c:"vbd5X", n:16, p:"vbd5X123" },
  { c:"AZq0M", n:15, p:"AZq0M123" }
];

let user = null;
const ref = doc(db,"rotacoes","estado");

// 🔹 INICIALIZAR
async function init(){
  const s = await getDoc(ref);
  if(!s.exists()){
    await setDoc(ref,{
      alunos: alunos.map((a,i)=>({...a,ord:i+1,esc:null})),
      rot:[[],[],[],[],[]]
    });
  }
}
init();

// 🔹 REALTIME
onSnapshot(ref,s=>{
  if(user) render(s.data());
});

// 🔹 LOGIN (CORRIGIDO COM TRIM)
window.login = function(){
  const c = document.getElementById("codigo").value.trim();
  const p = document.getElementById("pass").value.trim();

  const a = alunos.find(x=>x.c===c && x.p===p);

  if(!a){
    document.getElementById("erro").innerText="Login inválido";
    return;
  }

  user = c;
  document.getElementById("erro").innerText="";
  document.getElementById("app").style.display="block";
};

// 🔹 VEZ
function vez(d){
  return d.alunos.find(a=>!a.esc);
}

// 🔹 RENDER
function render(d){
  const a = d.alunos.find(x=>x.c===user);
  const v = vez(d);

  document.getElementById("info").innerText =
    `Código ${a.c} | Nota ${a.n}`;

  const div = document.getElementById("botoes");
  div.innerHTML="";

  for(let i=1;i<=5;i++){
    const b=document.createElement("button");
    b.innerText="Rotação "+i;

    const cheio = d.rot[i-1].length>=4;
    const limite = d.rot.filter(r=>r.length==4).length>=3;

    const pode =
      !a.esc &&
      v.c===user &&
      !cheio &&
      !(d.rot[i-1].length==3 && limite);

    b.disabled=!pode;
    b.onclick=()=>escolher(i);

    div.appendChild(b);
  }
}

// 🔹 ESCOLHER
async function escolher(r){
  await runTransaction(db,async t=>{
    const s=await t.get(ref);
    const d=s.data();

    const i=d.alunos.findIndex(a=>a.c===user);
    if(d.alunos[i].esc) return;

    d.alunos[i].esc=r;
    d.rot[r-1].push(user);

    t.update(ref,d);
  });
}

</script>

</body>
</html>
