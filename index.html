<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Rotações</title>
<style>
body { font-family: Arial; padding: 20px; background:#f5f5f5; }
.card { background:white; padding:20px; margin-top:20px; border-radius:10px; }
button { padding:10px; margin:5px; }
</style>
</head>

<body>

<h1>Escolha de Rotações</h1>

<div class="card">
  <input id="codigo" placeholder="Código">
  <input id="pass" placeholder="Password" type="password">
  <button onclick="login()">Entrar</button>
  <p id="erro" style="color:red;"></p>
</div>

<div id="app" style="display:none;">
  <h3 id="info"></h3>
  <p id="estado"></p>
  <div id="botoes"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc,
  onSnapshot, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNZ1IQ5hfYR6P1GjWrhTu2S6sXR2-lc2Q",
  authDomain: "rotacoes-medicina.firebaseapp.com",
  projectId: "rotacoes-medicina",
  storageBucket: "rotacoes-medicina.firebasestorage.app",
  messagingSenderId: "423261465889",
  appId: "1:423261465889:web:ebe7ccab01ee07c01e6260"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const alunos = [
  { c:"7adYa", n:20, p:"7adYa123" },
  { c:"2rd0X", n:19, p:"2rd0X123" },
  { c:"ANLjX", n:19, p:"ANLjX123" },
  { c:"v3yEg", n:19, p:"v3yEg123" },
  { c:"vGaVK", n:19, p:"vGaVK123" },
  { c:"vKaEg", n:19, p:"vKaEg123" },
  { c:"2EPxV", n:18, p:"2EPxV123" },
  { c:"2jBrG", n:18, p:"2jBrG123" },
  { c:"2QwzN", n:18, p:"2QwzN123" },
  { c:"7PqR9", n:18, p:"7PqR9123" },
  { c:"7RwrO", n:18, p:"7RwrO123" },
  { c:"A95z0", n:18, p:"A95z0123" },
  { c:"v5mDl", n:18, p:"v5mDl123" },
  { c:"vzm59", n:18, p:"vzm59123" },
  { c:"Ag1Qy", n:17, p:"Ag1Qy123" },
  { c:"vodZZ", n:17, p:"vodZZ123" },
  { c:"vbd5X", n:16, p:"vbd5X123" },
  { c:"AZq0M", n:15, p:"AZq0M123" } // NA → 15
];

let user=null;
const ref=doc(db,"rotacoes","estado");

async function init(){
  const s=await getDoc(ref);
  if(!s.exists()){
    await setDoc(ref,{
      alunos: alunos.map((a,i)=>({...a,o:i+1,e:null})),
      rot:[[],[],[],[],[]]
    });
  }
}
init();

onSnapshot(ref,s=>{
  if(user) render(s.data());
});

window.login=function(){
  const c=document.getElementById("codigo").value;
  const p=document.getElementById("pass").value;

  const a=alunos.find(x=>x.c===c && x.p===p);

  if(!a){
    document.getElementById("erro").innerText="Login inválido";
    return;
  }

  user=c;
  document.getElementById("app").style.display="block";
};

function vez(d){
  return d.alunos.find(a=>!a.e);
}

function render(d){
  const a=d.alunos.find(x=>x.c===user);
  const v=vez(d);

  document.getElementById("info").innerText=
    `Código ${a.c} | Nota ${a.n}`;

  const div=document.getElementById("botoes");
  div.innerHTML="";

  for(let i=1;i<=5;i++){
    const b=document.createElement("button");
    b.innerText="Rotação "+i;

    const cheio=d.rot[i-1].length>=4;
    const limite=d.rot.filter(r=>r.length==4).length>=3;

    const pode=!a.e && v.c===user &&
      !cheio &&
      !(d.rot[i-1].length==3 && limite);

    b.disabled=!pode;
    b.onclick=()=>escolher(i);

    div.appendChild(b);
  }
}

async function escolher(r){
  await runTransaction(db,async t=>{
    const s=await t.get(ref);
    const d=s.data();

    const i=d.alunos.findIndex(a=>a.c===user);
    if(d.alunos[i].e) return;

    d.alunos[i].e=r;
    d.rot[r-1].push(user);

    t.update(ref,d);
  });
}

</script>

</body>
</html>
